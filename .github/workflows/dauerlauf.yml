# Der Wahlabend-Lauf: einmal von Hand starten, dann spiegelt er stundenlang
# im festen Takt. Von Hand, weil ein Zeitplan bei GitHub nicht puenktlich ist
# und am Wahlabend Minuten zaehlen.
name: Dauerlauf

on:
  workflow_dispatch:
    inputs:
      minuten:
        description: 'Laufzeit in Minuten (Hoechstwert 340)'
        required: true
        default: '330'
      takt:
        description: 'Abstand zwischen zwei Abrufen in Sekunden (mindestens 120)'
        required: true
        default: '120'
      trocken:
        description: 'Trocken einspielen: rechnen und melden, aber nichts ablegen'
        type: boolean
        default: false

permissions:
  contents: write

# Nie zwei Laeufe gleichzeitig - sonst schieben sich zwei Commits ins Gehege.
concurrency:
  group: spiegel
  cancel-in-progress: false

jobs:
  spiegeln:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Absender setzen
        run: |
          git config user.name  'Spiegel'
          git config user.email 'spiegel@users.noreply.github.com'

      - name: Im Takt spiegeln
        env:
          MINUTEN: ${{ inputs.minuten }}
          TAKT: ${{ inputs.takt }}
          BWA_ZIEL: ${{ secrets.BWA_ZIEL }}
          BWA_SCHLUESSEL: ${{ secrets.BWA_SCHLUESSEL }}
          BWA_TROCKEN: ${{ inputs.trocken && '1' || '0' }}
        run: |
          set -uo pipefail

          # Das Landeswahlamt bittet ausdruecklich um mindestens zwei Minuten
          # Abstand. Ein kleinerer Wert wird stillschweigend angehoben.
          [ "$TAKT" -ge 120 ] 2>/dev/null || TAKT=120
          [ "$MINUTEN" -le 340 ] 2>/dev/null || MINUTEN=340

          ende=$(( $(date +%s) + MINUTEN * 60 ))
          durchgang=0

          echo "Laufzeit $MINUTEN Minuten, Takt $TAKT Sekunden."

          while [ "$(date +%s)" -lt "$ende" ]; do
            durchgang=$(( durchgang + 1 ))
            echo "::group::Durchgang $durchgang um $(date -u '+%H:%M:%S') UTC"

            ./spiegeln.sh || echo 'Mindestens eine Quelle hat nicht geantwortet.'

            # Unmittelbar weiterreichen, vor dem Schieben: Der direkte Weg ist
            # der schnelle. Das Ablegen hier ist nur der Rueckfallweg, falls die
            # Einspieltuer einmal nicht erreichbar ist.
            #
            # Jedes Mal, auch wenn sich nichts geaendert hat. Das Plugin erkennt
            # eine unveraenderte Lieferung an der Pruefsumme und legt sie nicht
            # noch einmal ab; ein Durchgang, der nach einem Fehlschlag wieder
            # zustellt, ist das mehr wert als die gesparte Anfrage.
            ./einspielen.sh || echo 'Die Einspielung ist misslungen, der Spiegel bleibt der Rueckfallweg.'

            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Stand $(date -u '+%Y-%m-%d %H:%M') UTC"

              # Der Taktlauf koennte zwischendurch geschoben haben.
              git pull --rebase --autostash || true

              if git push; then
                echo 'Neuer Stand veroeffentlicht.'
              else
                echo 'Das Schieben ist misslungen, naechster Durchgang versucht es erneut.'
              fi
            fi

            echo '::endgroup::'

            # Nicht ueber das Ende hinaus schlafen.
            [ "$(( $(date +%s) + TAKT ))" -lt "$ende" ] || break
            sleep "$TAKT"
          done

          echo "Fertig nach $durchgang Durchgaengen."
